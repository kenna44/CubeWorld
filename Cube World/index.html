<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGL Canvas</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;          /* no scrollbars */
    }
    body {
      display: flex;
      flex-direction: column;
      background: #c965ff;
    }
    #levelButtons {
      display: flex;
      justify-content: center;   /* centers the buttons */
      gap: 8px;
      padding: 8px;
    }
    #levelButtons button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    #levelButtons button.active {
      background: #c965ff;
      color: white;
      font-weight: bold;
    }
    #canvasWrap {
      flex: 1;                   /* take all remaining height */
      min-height: 0;             /* lets it shrink instead of overflowing */
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #c965ff;
    }
  </style>
</head>
<body>

  <div id="levelButtons">
    <button data-level="1">Level 1</button>
    <button data-level="2">Level 2</button>
    <button data-level="3">Level 3</button>
    <button data-level="4">Level 4</button>
  </div>

  <div id="canvasWrap">
    <canvas id="glCanvas">
      Your browser does not support the HTML5 canvas element.
    </canvas>
  </div>

  <script src="src/gl-matrix-min.js"></script>
  <script>
    (function () {
      const current = new URLSearchParams(location.search).get('level') || '3';

      document.querySelectorAll('#levelButtons button').forEach(btn => {
        const lvl = btn.dataset.level;
        if (lvl === current) btn.classList.add('active');
        btn.addEventListener('click', () => {
          location.search = '?level=' + lvl;
        });
      });

      // your level files read canvas.clientWidth/clientHeight once at startup,
      // so reload if the window size changes to keep the aspect ratio correct
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => location.reload(), 250);
      });

      const script = document.createElement('script');
      script.src = encodeURI('./src/Level ' + current + '.js');
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
